[project]
name = "everychat"
version = "0.1.0"
description = "Search every AI conversation you've ever had. ChatGPT, Claude, Gemini, Claude Code, Codex. Local, free, with an MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Wayne Chen" }]
keywords = ["chatgpt", "claude", "gemini", "claude-code", "codex", "search", "mcp", "history", "sqlite", "fts5"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = [
  "mcp>=1.2",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.4", "numpy>=1.24"]

[project.scripts]
everychat = "everychat.cli:main"

[project.urls]
Homepage = "https://github.com/WayneLY-Chen/everychat"
Issues = "https://github.com/WayneLY-Chen/everychat/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/everychat"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
